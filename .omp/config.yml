# jarvis-upper — REPO-LEVEL omp overlay. The worker's cwd IS this directory in
# every AO worktree, so these roles apply to every AO-spawned omp worker here
# regardless of the daemon's env. Mirrors ~/.omp/profiles/jarvis-worker/agent/config.yml.
#   RULE A: opencode-go is ONLY ever muse-spark-1.3-contributor
#   RULE B: opencode-go rate limit -> free poolside laguna on OpenRouter
#   RULE C: OpenRouter = FREE MODELS ONLY
modelRoles:
  task: opencode-go/muse-spark-1.3-contributor
  smol: opencode-go/muse-spark-1.3-contributor
  default: openrouter/poolside/laguna-s-2.1:free
  slow: nvidia/moonshotai/kimi-k3
# headless factory workers must never stall on an approval prompt
tools:
  approvalMode: yolo

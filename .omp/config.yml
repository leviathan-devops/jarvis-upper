# jarvis-upper — REPO-LEVEL omp overlay. The worker's cwd IS this directory in
# every AO worktree, so these roles apply to every AO-spawned omp worker here
# regardless of the daemon's env. Mirrors ~/.omp/profiles/jarvis-worker/agent/config.yml.
#   default/task = POOLSIDE DIRECT (inference.poolside.ai — NOT OpenRouter)
#   sonic/reviewer/plan/slow = zen-free muse-spark-1.3 :xhigh
#   smol/scout = openrouter nemotron-3.5-lightning :free
#   LAW: muse-spark-1.3* -> ALWAYS :xhigh · laguna* -> ALWAYS :high
modelRoles:
  default: poolside/poolside/laguna-s-2.1:high
  task: poolside/poolside/laguna-s-2.1:high
  sonic: opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
  reviewer: opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
  plan: opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
  slow: opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
  smol: openrouter/nvidia/nemotron-3.5-lightning:free
  scout: openrouter/nvidia/nemotron-3.5-lightning:free
retry:
  modelFallback: true
  fallbackChains:
    "opencode-zen-free/*":
      - opencode-go/muse-spark-1.3-contributor:xhigh
      - poolside/poolside/laguna-s-2.1:high
    "opencode-go/*":
      - poolside/poolside/laguna-s-2.1:high
      - opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
    "openrouter/*":
      - opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
      - opencode-go/muse-spark-1.3-contributor:xhigh
    "poolside/*":
      - opencode-go/muse-spark-1.3-contributor:xhigh
      - opencode-zen-free/muse-spark-1.3-contributor-free:xhigh
# headless factory workers must never stall on an approval prompt
tools:
  approvalMode: yolo
